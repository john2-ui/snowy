name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC 14
            os: ubuntu-24.04
            config: Release
            configure: >-
              -G Ninja
              -DCMAKE_CXX_COMPILER=g++-14
              -DCMAKE_BUILD_TYPE=Release
          - name: Linux Clang 18 ASan + UBSan
            os: ubuntu-24.04
            config: Debug
            configure: >-
              -G Ninja
              -DCMAKE_CXX_COMPILER=clang++-18
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          - name: macOS Clang 20 + libc++
            os: macos-14
            config: Release
          - name: Windows MSVC 2022 Debug
            os: windows-2022
            config: Debug
            configure: >-
              -G "Visual Studio 17 2022" -A x64
          - name: Windows MSVC 2022 Release
            os: windows-2022
            config: Release
            configure: >-
              -G "Visual Studio 17 2022" -A x64

    steps:
      - uses: actions/checkout@v6

      - name: Install liburing
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm@20
          llvm_prefix="$(brew --prefix llvm@20)"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSNOWY_BUILD_BENCHMARKS=ON \
            -DCMAKE_CXX_COMPILER="$llvm_prefix/bin/clang++" \
            -DCMAKE_CXX_FLAGS="-nostdinc++ -isystem $llvm_prefix/include/c++/v1" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$llvm_prefix/lib/c++ -L$llvm_prefix/lib/unwind -Wl,-rpath,$llvm_prefix/lib/c++ -Wl,-rpath,$llvm_prefix/lib/unwind -lunwind"

      - name: Checkout modern liburing
        if: runner.os == 'Linux' && matrix.config == 'Debug'
        uses: actions/checkout@v6
        with:
          repository: axboe/liburing
          ref: 08468cc3830185c75f9e7edefd88aa01e5c2f8ab
          path: build-liburing

      - name: Build modern liburing
        if: runner.os == 'Linux' && matrix.config == 'Debug'
        working-directory: build-liburing
        run: |
          ./configure --prefix="$GITHUB_WORKSPACE/build-uring"
          make -C src -j2
          make -C src install

      - name: Configure
        if: runner.os != 'macOS'
        shell: bash
        run: cmake -S . -B build -DSNOWY_BUILD_BENCHMARKS=ON ${{ matrix.configure }}

      - name: Checkout benchmark reference
        if: runner.os == 'Linux' && matrix.config == 'Release'
        uses: actions/checkout@v6
        with:
          repository: condy-cpp/condy
          ref: 01dcf995b711e67ac4416a07fdfe6347a388ad14
          path: build-condy

      - name: Configure modern liburing
        if: runner.os == 'Linux' && matrix.config == 'Debug'
        run: cmake -S . -B build -DURING_INCLUDE_DIR="$PWD/build-uring/include" -DURING_LIBRARY="$PWD/build-uring/lib/liburing.a"

      - name: Configure comparison
        if: runner.os == 'Linux' && matrix.config == 'Release'
        shell: bash
        run: |
          cmake -S . -B build -DSNOWY_CONDY_INCLUDE_DIR="$PWD/build-condy/include" \
            -DURING_LIBRARY="$(g++-14 -print-file-name=liburing.a)"

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.config }} --output-on-failure --output-junit "${{ github.workspace }}/build/results.xml"

      - name: Annotate test failures
        if: failure()
        shell: python
        run: |
          import pathlib
          import xml.etree.ElementTree as xml
          report = pathlib.Path('build/results.xml')
          if report.exists():
              for case in xml.parse(report).iter('testcase'):
                  if case.find('failure') is not None:
                      output = (case.findtext('system-out') or 'Test failed or timed out')[-3000:]
                      output = output.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={case.get('name')}::{output}")

      - name: Require native Linux optimizations
        if: runner.os == 'Linux'
        env:
          SNOWY_REQUIRE_ADVANCED: '1'
        run: |
          ctest --test-dir build --output-on-failure -R 'snowy\.uring\.(recv|accept|zc|fail|sparse|directfd|fixednet|ringfd)$'
          ./build/bench/snowy_rx multi 1000 2048

      - name: Comparison smoke run (not a performance ranking)
        if: runner.os == 'Linux' && matrix.config == 'Release'
        run: |
          ./build/bench/snowy_compare task 1000000
          ./build/bench/snowy_compare schedule 1000000
          ./build/bench/snowy_compare nop 10000 32
